name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify preview package version
        run: |
          python -c "from importlib.metadata import version; assert version('rapistops') == '0.1.0.dev1'"

      - name: Run database-free tests
        run: python -m pytest -m "not database" -q

      - name: Start disposable PostgreSQL
        run: docker compose --profile tests up -d --wait --wait-timeout 120 db-test

      - name: Run database tests
        env:
          RAPISTOPS_TEST_DATABASE_URL: postgresql://rapistops_test:rapistops_tests_only@127.0.0.1:55433/rapistops_test
        run: python -m pytest --run-database -m database -q

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose --profile tests logs --no-color db-test

      - name: Remove disposable CI database
        if: always()
        run: docker compose --profile tests down -v
