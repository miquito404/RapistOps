name: rapistops-dev

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: rapistops_dev
      POSTGRES_USER: rapistops_dev
      POSTGRES_PASSWORD: rapistops_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rapistops_dev", "-d", "rapistops_dev"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  db-test:
    profiles: ["tests"]
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: rapistops_test
      POSTGRES_USER: rapistops_test
      POSTGRES_PASSWORD: rapistops_tests_only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./data/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rapistops_test", "-d", "rapistops_test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
